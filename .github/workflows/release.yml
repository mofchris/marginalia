name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Lets the SignPath action read the unsigned workflow artifact.
  actions: read

# Windows code signing through SignPath Foundation (free for open source).
# It stays OFF until both of these exist in the repo settings
# (Settings > Secrets and variables > Actions):
#   secret   SIGNPATH_API_TOKEN       API token of the SignPath submitter user
#   variable SIGNPATH_ORGANIZATION_ID SignPath organization id
# Optional variables (defaults in brackets):
#   SIGNPATH_PROJECT_SLUG [marginalia], SIGNPATH_SIGNING_POLICY_SLUG [release-signing],
#   (the SignPath project's default artifact configuration is used)
# Without them every platform builds and uploads unsigned, exactly as before.
# See docs/signpath-application.md.

jobs:
  # Signed Windows installers are attached after the build, so create the
  # draft release up front. Otherwise two Windows jobs could each create one.
  # tauri-action finds and reuses this draft by its tag.
  prepare-release:
    name: Prepare draft release
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Marginalia $TAG" --notes "" --verify-tag
          fi

  build:
    needs: prepare-release
    # Run even when prepare-release was skipped (signing not set up).
    if: ${{ !cancelled() && needs.prepare-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: ""
          - name: Windows ARM64
            os: windows-latest
            rust-targets: aarch64-pc-windows-msvc
            # MSI (WiX) cannot cross-build for ARM64 on an x64 runner; NSIS can.
            tauri-args: "--target aarch64-pc-windows-msvc --bundles nsis"
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: "--target universal-apple-darwin"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Code signing (optional — builds are unsigned until these secrets exist):
      #   Windows: set WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD and add
      #            "certificateThumbprint" etc. under bundle.windows in tauri.conf.json,
      #            or use an external signing tool via bundle.windows.signCommand.
      #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #            APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID — tauri-action
      #            picks these up automatically for signing + notarization.
      #
      # Only export Apple signing vars that are actually set: an empty
      # APPLE_CERTIFICATE still counts as "set" to the Tauri bundler, which then
      # fails trying to import an empty keychain certificate.
      - name: Export Apple signing env (only when secrets are configured)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              {
                echo "$v<<__EOF__"
                echo "${!v}"
                echo "__EOF__"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Check whether SignPath signing is set up
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath signing is on for this job."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath signing is off for this job; building unsigned."
          fi

      # Unsigned path (macOS always; Windows until SignPath is set up):
      # build and attach straight to the draft release.
      - name: Build and attach to the release
        if: steps.signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Marginalia ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.tauri-args }}

      # Signed Windows path: build only, sign through SignPath, then attach.
      - name: Build Windows installers (not attached yet)
        if: steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.tauri-args }}

      - name: Collect unsigned installers
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p unsigned
          # Match this version only: the Rust cache can restore older bundles.
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name "Marginalia_${version}_*-setup.exe" -o -name "Marginalia_${version}_*.msi" \) \
            -exec cp {} unsigned/ \;
          ls -l unsigned
          if [ -z "$(ls -A unsigned)" ]; then
            echo "No installers found for version $version" >&2
            exit 1
          fi

      - name: Upload unsigned installers for SignPath
        if: steps.signing.outputs.enabled == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.rust-targets }}
          path: unsigned/
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'marginalia' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Each request is approved by hand in SignPath; allow up to an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Attach signed installers to the release
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l signed
          # Same file names as the unsigned assets, so download links keep working.
          gh release upload "$TAG" signed/* --repo "$GITHUB_REPOSITORY" --clobber
