<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marginalia</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="topbar-group file-controls">
          <button id="btn-new" class="tb-btn" title="New file (Ctrl+N)" aria-label="New file">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M9 1H4a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 4 15h8a1.5 1.5 0 0 0 1.5-1.5V5.5L9 1Z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9 1v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button id="btn-open" class="tb-btn" title="Open… (Ctrl+O)" aria-label="Open file">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h3l1.5 2H13A1.5 1.5 0 0 1 14.5 6v6A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12V4Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <div class="tb-dropdown">
            <button id="btn-recent" class="tb-btn" title="Recent files" aria-label="Recent files" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 4.5V8l2.5 1.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
            <div id="recent-menu" class="menu" hidden></div>
          </div>
          <span class="tb-sep"></span>
          <button id="btn-save" class="tb-btn" title="Save (Ctrl+S)" aria-label="Save file">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2.5 3A1.5 1.5 0 0 1 4 1.5h7L14.5 5v8A1.5 1.5 0 0 1 13 14.5H4A1.5 1.5 0 0 1 2.5 13V3Z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 1.5V5h5V1.5M5 14.5V10h6v4.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
        <div id="file-title" class="file-title">
          <button id="file-name-btn" class="file-title-btn" title="Rename (Enter)" aria-label="Rename file"><span id="file-name">Untitled</span></button><span id="dirty-dot" class="dirty-dot" hidden>&#9679;</span>
          <input id="file-name-input" class="file-title-input" aria-label="File name" spellcheck="false" autocomplete="off" hidden />
        </div>
        <div class="topbar-actions">
          <div class="writing-controls">
            <button id="btn-find" class="sb-btn" aria-pressed="false" title="Find (Ctrl+F)">Find</button>
            <button id="btn-outline" class="sb-btn" aria-pressed="false" title="Outline (Ctrl+Shift+O)">Outline</button>
            <button id="btn-focus" class="sb-btn" aria-pressed="false" title="Focus mode (F8)">Focus</button>
          </div>
          <div class="topbar-group view-controls">
          <button id="btn-source" class="tb-btn" title="Toggle source view (Ctrl+/)" aria-label="Show Markdown source" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="m5.5 4.5-4 3.5 4 3.5M10.5 4.5l4 3.5-4 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-theme" class="tb-btn" title="Toggle light/dark theme" aria-label="Toggle light or dark theme">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M13.5 9.5A5.8 5.8 0 0 1 6.5 2.5a5.8 5.8 0 1 0 7 7Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          </div>
        </div>
      </header>
      <section id="find-bar" aria-label="Find and replace" hidden>
        <div class="find-row">
          <button id="replace-toggle" class="find-icon-btn" aria-expanded="false" aria-controls="replace-row" aria-label="Show replace" title="Replace (Ctrl+H)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="find-field">
            <input id="find-query" type="text" aria-label="Find in document" placeholder="Find" autocomplete="off" spellcheck="false" />
            <span id="find-count" class="find-count" role="status"></span>
            <button id="find-case" class="find-toggle" aria-pressed="false" aria-label="Match case" title="Match case">Aa</button>
          </div>
          <button id="find-prev" class="find-icon-btn" aria-label="Previous match" title="Previous match (Shift+Enter)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="m4 10 4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="find-next" class="find-icon-btn" aria-label="Next match" title="Next match (Enter)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="find-spacer"></span>
          <button id="find-close" class="find-icon-btn" aria-label="Close find" title="Close (Esc)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="replace-row" class="find-row" hidden>
          <span class="find-indent" aria-hidden="true"></span>
          <div class="find-field">
            <input id="replace-text" type="text" aria-label="Replace with" placeholder="Replace with" autocomplete="off" spellcheck="false" />
          </div>
          <button id="replace-one" class="sb-btn">Replace</button>
          <button id="replace-all" class="sb-btn">Replace all</button>
        </div>
      </section>
      <div id="notice-bar" class="notice-bar" role="status" aria-live="polite" hidden>
        <span id="notice-text"></span>
        <button id="notice-action" class="notice-btn" hidden></button>
        <button id="notice-close" class="notice-btn">Dismiss</button>
      </div>
      <main id="editor-host">
        <aside id="outline-panel" aria-label="Document outline" hidden>
          <div class="outline-heading"><strong>Outline</strong><button id="outline-close" class="sb-btn" aria-label="Close outline">Close</button></div>
          <nav id="outline-items" aria-label="Headings"></nav>
        </aside>
        <div id="editor-root"></div>
        <div id="welcome" class="welcome" hidden>
          <div class="welcome-inner">
            <img class="welcome-logo" src="/src-tauri/icons/128x128@2x.png" width="64" height="64" alt="" />
            <h1>Marginalia</h1>
            <p>Open a Markdown file or create a new document. Drop a file anywhere in this window.</p>
            <div class="welcome-actions">
              <button id="welcome-open" class="primary-btn">Open a file</button>
              <button id="welcome-new" class="ghost-btn">New document</button>
            </div>
            <div id="welcome-recent"></div>
          </div>
        </div>
      </main>
      <footer id="statusbar">
        <span id="status-type"></span>
        <span id="save-status" role="status" aria-live="polite"></span>
        <span class="status-spacer"></span>
        <span id="status-words"></span>
        <span class="status-sep"></span>
        <button id="btn-width" class="sb-btn" title="Column width">Narrow</button>
        <span class="zoom-group">
          <button id="btn-zoom-out" class="sb-btn sb-icon" title="Zoom out (Ctrl+-)" aria-label="Zoom out">&#8722;</button>
          <button id="btn-zoom-reset" class="sb-btn sb-zoom" title="Reset zoom (Ctrl+0)">100%</button>
          <button id="btn-zoom-in" class="sb-btn sb-icon" title="Zoom in (Ctrl+=)" aria-label="Zoom in">+</button>
        </span>
      </footer>
    </div>
    <button id="exit-focus" aria-label="Exit focus mode" title="Exit focus mode (Esc)" hidden>
      <svg viewBox="0 0 16 16" width="15" height="15"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M6 13.5V10H2.5M10 13.5V10h3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-message" tabindex="-1">
        <p id="modal-message"></p>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>
  </body>
</html>
